name: Update Entebbe movements

# Twice daily. The EBB airport board only reaches ~2 days back, so the
# schedule IS the archive: a missed day is lost permanently.
#
# After the SECOND run of the day (16:15 EAT) it also emails a report of
# what was added. Secrets required:
#   FR24_SUBSCRIPTION_KEY   the FR24 subscription key
#   SMTP_USER / SMTP_PASS   mailbox login + app password (email only)
#   MAIL_TO                 where the report goes

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest date to rebuild (blank = 7 days ago)"
        required: false
        default: ""
      fetch_tracks:
        description: "Also download tracks"
        type: boolean
        default: true
      email:
        description: "Email the report after this run"
        type: boolean
        default: true
  schedule:
    - cron: "15 4 * * *"    # 07:15 EAT
    - cron: "15 13 * * *"   # 16:15 EAT  <- second export; report is emailed

permissions:
  contents: write

concurrency:
  group: ebb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FR24 library
        run: pip install "fr24[curl,polars]==0.4.0" tzdata

      - name: Check the subscription key is present
        env:
          FR24_SUBSCRIPTION_KEY: ${{ secrets.FR24_SUBSCRIPTION_KEY }}
        run: |
          if [ -z "$FR24_SUBSCRIPTION_KEY" ]; then
            echo "::error::FR24_SUBSCRIPTION_KEY is empty - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "key present"

      - name: Snapshot state before the run
        run: python scripts/report_daily.py --snapshot

      - name: Rebuild board (all carriers)
        env:
          FR24_SUBSCRIPTION_KEY: ${{ secrets.FR24_SUBSCRIPTION_KEY }}
        run: |
          SINCE="${{ inputs.since }}"
          if [ -z "$SINCE" ]; then SINCE=$(date -u -d '3 days ago' +%F); fi
          echo "rebuilding back to $SINCE"
          python scripts/rebuild_all.py --since "$SINCE" --grow-seed --sleep 3

      - name: Audit coverage
        continue-on-error: true
        run: python scripts/audit_coverage.py || true

      - name: Download tracks
        if: ${{ github.event_name == 'schedule' || inputs.fetch_tracks }}
        continue-on-error: true
        env:
          FR24_SUBSCRIPTION_KEY: ${{ secrets.FR24_SUBSCRIPTION_KEY }}
        run: python scripts/fetch_tracks_all.py data/track_targets.csv --out tracks --skip-existing

      - name: Write report
        run: python scripts/report_daily.py --report

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "EBB update $(date -u +%F) ($(date -u +%H:%M)Z)"
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Email the report (second run of the day, or on demand)
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 13 * * *') || inputs.email }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REPO_SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          from pathlib import Path

          body = Path("/tmp/ebb_report.md").read_text() if Path("/tmp/ebb_report.md").exists() else "No report was produced."
          subject = Path("/tmp/ebb_subject.txt").read_text().strip() if Path("/tmp/ebb_subject.txt").exists() else "EBB update"
          body += f"\n\nWorkflow run: https://github.com/{os.environ.get('REPO_SLUG','')}/actions/runs/{os.environ.get('RUN_ID','')}\n"

          host = os.environ.get("SMTP_HOST") or "smtp.gmail.com"
          user = os.environ.get("SMTP_USER", "")
          password = os.environ.get("SMTP_PASS", "")
          to = os.environ.get("MAIL_TO", "")
          if not (user and password and to):
              print("::warning::SMTP_USER / SMTP_PASS / MAIL_TO not all set - skipping email")
              raise SystemExit(0)

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = user
          msg["To"] = to
          msg.set_content(body)

          port = int(os.environ.get("SMTP_PORT") or 587)
          with smtplib.SMTP(host, port, timeout=30) as s:
              s.starttls(context=ssl.create_default_context())
              s.login(user, password)
              s.send_message(msg)
          print(f"report emailed to {to}")
          PY
